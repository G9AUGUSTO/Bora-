<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Bora+ · Meu perfil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">

      <div class="card profile-card">
        <h2>Sua conta foi criada com sucesso</h2>

        <a class="btn btn--ghost" href="admin-cadastro.html">Cadastrar um estabelecimento</a>
      </div>
    </div>

    <nav class="tabbar">
      <div class="tabbar__inner">
        <a class="tabbar__item" href="pesquisa.html"><span>🔍</span>Pesquisar</a>
        <a class="tabbar__item" href="mapa.html"><span>📍</span>Mapa</a>
        <a class="tabbar__item is-active" href="perfil.html"><span>👤</span>Perfil</a>
      </div>
    </nav>
  </div>

</body>
</html>
