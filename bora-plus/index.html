<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bora+ · Entrar</title>
</head>
<body>
  <div class="screen">
    <div class="app-frame login-frame">

      <div class="login-hero">
        <a class="wordmark" href="index.html">Bora<span>+</span></a>
        <p class="login-hero__tag">Descubra o que tá rolando perto de você hoje.</p>
      </div>

      <div class="card login-card">
        <h1>Entrar</h1>
        <p class="login-card__sub">Acesse sua conta para ver bares e eventos perto de você.</p>

        <div id="loginMsg" class="msg msg--error" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn--primary">Entrar</button>
        </form>

        <p class="login-switch">
          Ainda não tem conta? <a href="cadastro-conta.html">Criar conta</a>
        </p>
      </div>

      <p class="login-demo-hint">Demo local — os dados ficam salvos apenas neste navegador.</p>
    </div>
  </div>

</body>
</html>
